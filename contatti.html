  <main class="page-main">
    <div class="container">
      <div class="row g-5">
        <div class="col-lg-5">
          <h1>Contatti</h1>
          <p class="lead">Scrivimi attraverso il modulo: ti risponderò appena possibile.</p>
          <ul class="list-unstyled contact-info">
            <li><strong>Città:</strong> Bari</li>
            <li><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/nicole-alilo-mbo/" target="_blank" rel="noopener">il mio profilo</a></li>
            <li><strong>GitHub:</strong> <a href="https://github.com/nicolealilombo97" target="_blank" rel="noopener">il mio profilo</a></li>
          </ul>
        </div>

        <div class="col-lg-7">
          <!-- Sostituisci l'URL in "action" con quello del tuo form su Formspree (vedi guida) -->
          <form class="contact-form" action="https://formspree.io/f/mgaajkvq" method="POST">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome e cognome</label>
              <input type="text" class="form-control" id="nome" name="nome" autocomplete="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="oggetto" class="form-label">Oggetto</label>
              <input type="text" class="form-control" id="oggetto" name="oggetto" required>
            </div>
            <div class="mb-3">
              <label for="messaggio" class="form-label">Messaggio</label>
              <textarea class="form-control" id="messaggio" name="messaggio" rows="5" required></textarea>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="privacy" name="privacy" required>
              <label class="form-check-label" for="privacy">Acconsento al trattamento dei dati per rispondere alla mia richiesta.</label>
            </div>
            <button type="submit" class="btn btn-accent btn-lg">Invia messaggio</button>
          </form>
        </div>
      </div>
    </div>
